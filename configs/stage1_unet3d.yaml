{
  "experiment": {
    "name": "stage1_height_preserving_unet3d",
    "seed": 2026,
    "output_dir": "outputs/stage1_unet3d"
  },
  "data": {
    "train_index": "metadata/stage1_patch_indices/train.json",
    "val_index": "metadata/stage1_patch_indices/val.json",
    "test_index": "metadata/stage1_patch_indices/test.json",
    "normalization": "metadata/normalization/stage1_positive_qc.json",
    "train_positive_only": true,
    "val_positive_only": true,
    "batch_size": 1,
    "block_size": 16,
    "num_workers": 2,
    "cache_size": 1,
    "pin_memory": true,
    "persistent_workers": true
  },
  "model": {
    "in_channels": 3,
    "out_channels": 1,
    "base_channels": 16,
    "channel_multipliers": [1, 2, 4, 8, 16],
    "max_groups": 8,
    "bottleneck_dropout": 0.1
  },
  "loss": {
    "name": "masked_smooth_l1",
    "beta": 0.2,
    "thresholds_mm_h": [1.0, 5.0, 10.0, 30.0]
  },
  "optimizer": {
    "name": "adamw",
    "learning_rate": 0.0001,
    "weight_decay": 0.0001
  },
  "scheduler": {
    "name": "cosine",
    "eta_min": 0.000001
  },
  "training": {
    "epochs": 100,
    "accumulation_steps": 1,
    "grad_clip_norm": 1.0,
    "amp": true,
    "amp_initial_scale": 1024.0,
    "checkpoint_every": 10
  },
  "evaluation": {
    "max_batches": null,
    "save_orbits": 0
  },
  "postprocessing": {
    "enabled": true,
    "fail_on_error": false,
    "test_sample_count": 6,
    "selection_seed": 2026,
    "height_km": 2.0,
    "max_scatter_points": 200000,
    "device": "auto",
    "dpi": 150
  },
  "runtime": {
    "deterministic": false,
    "distributed": {
      "backend": "auto",
      "timeout_seconds": 300,
      "broadcast_buffers": false,
      "find_unused_parameters": false,
      "gradient_as_bucket_view": true,
      "static_graph": true,
      "bucket_cap_mb": 25.0
    }
  }
}
