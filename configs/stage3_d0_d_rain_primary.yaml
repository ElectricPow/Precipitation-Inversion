{
  "experiment": {
    "name": "stage3_d0_d_rain_primary",
    "method": "S3-D0-D-RainPrimary",
    "seed": 2026,
    "output_dir": "outputs/stage3/d0_d_rain_primary"
  },
  "sources": {
    "stage1_checkpoint": "outputs/ablations/stage1_i_g002_t3d/best.pt",
    "stage2_checkpoint": "outputs/stage2_ablations/four_channel_distance_intensity_w1p25/best_dbz.pt",
    "stage2_threshold_file": "outputs/stage2_ablations/four_channel_distance_intensity_w1p25/analysis/validation_candidates/reflectivity/support_threshold.json"
  },
  "data": {
    "batch_size": 1,
    "num_workers": 2,
    "cache_size": 1,
    "pin_memory": true,
    "persistent_workers": true,
    "sampler_source": "stage2_checkpoint_exact"
  },
  "adaptation": {
    "trainable_scope": "decoder_and_all_heads",
    "objective_mode": "rain_primary",
    "initialization_checkpoint": "outputs/stage3/d0_h_frozen_feature_probe/best_rain.pt",
    "initialization": "D0-H best_rain complete state; unfreeze complete decoder and all three heads",
    "satellite_inputs": false,
    "rain_objective": "source_stage1_I_plus_0.02G",
    "physical_objective": "source_stage2_support_plus_W1.25_dbz_as_auxiliary"
  },
  "gradient_audit": {
    "valid_batches_per_rank": 4,
    "max_candidate_batches_per_rank": 32,
    "target_weighted_stage2_to_rain_gradient_ratio": 0.25,
    "min_stage2_weight": 0.0001,
    "max_stage2_weight": 1.0
  },
  "optimizer": {
    "name": "adamw",
    "learning_rate": 0.00001,
    "weight_decay": 0.0001
  },
  "scheduler": {
    "name": "cosine",
    "eta_min": 0.000001
  },
  "training": {
    "epochs": 20,
    "accumulation_steps": 1,
    "grad_clip_norm": 1.0,
    "amp": true,
    "amp_initial_scale": 1024.0,
    "checkpoint_every": 10,
    "early_stopping": {
      "enabled": false,
      "reason": "complete all 20 epochs so the rain-primary decoder reaches the low-learning-rate phase"
    }
  },
  "evaluation": {
    "max_batches": null,
    "training_support_threshold": 0.5
  },
  "postprocessing": {
    "enabled": true,
    "fail_on_error": false,
    "device": "auto",
    "save_orbits": 6,
    "dpi": 150
  },
  "runtime": {
    "deterministic": false,
    "distributed": {
      "backend": "auto",
      "timeout_seconds": 600,
      "broadcast_buffers": false,
      "find_unused_parameters": false,
      "gradient_as_bucket_view": true,
      "static_graph": true,
      "bucket_cap_mb": 25.0
    }
  }
}
