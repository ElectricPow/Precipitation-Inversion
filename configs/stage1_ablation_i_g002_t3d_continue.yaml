{
  "experiment": {
    "name": "stage1_ablation_i_g002_t3d_continue",
    "seed": 2026,
    "output_dir": "outputs/ablations/stage1_i_g002_t3d"
  },
  "data": {
    "train_index": "metadata/stage1_patch_indices/train.json",
    "val_index": "metadata/stage1_patch_indices/val.json",
    "test_index": "metadata/stage1_patch_indices/test.json",
    "normalization": "metadata/normalization/stage1_dbz_valid.json",
    "cfb_input_mode": "baseline",
    "cfb_distance_scale_km": 2.0,
    "weak_cfb_layer_weights": [],
    "train_positive_only": true,
    "val_positive_only": true,
    "batch_size": 1,
    "block_size": 16,
    "num_workers": 2,
    "cache_size": 1,
    "pin_memory": true,
    "persistent_workers": true
  },
  "model": {
    "in_channels": 3,
    "out_channels": 1,
    "base_channels": 16,
    "channel_multipliers": [1, 2, 4, 8, 16],
    "max_groups": 8,
    "bottleneck_dropout": 0.1
  },
  "loss": {
    "name": "masked_smooth_l1",
    "beta": 0.2,
    "height_loss_weighting": "none",
    "height_loss_weight_min": 0.5,
    "height_loss_weight_max": 3.0,
    "intensity_loss_bin_edges": [1.0, 5.0, 10.0, 30.0],
    "intensity_loss_bin_weights": [1.0, 1.0, 1.5, 2.0, 3.0],
    "physical_gradient": {
      "enabled": true,
      "weight": 0.02,
      "beta": 1.0
    },
    "thresholds_mm_h": [1.0, 5.0, 10.0, 30.0]
  },
  "type_task": {
    "enabled": true,
    "source_variable": "typePrecip",
    "class_codes": [1, 2, 3],
    "class_names": ["stratiform", "convective", "other"],
    "class_weights": "inverse_sqrt_frequency",
    "loss_weight": 0.01,
    "rain_feedback": false,
    "head": {
      "kind": "ordered_3d",
      "num_classes": 3,
      "compressed_channels": 8,
      "height_levels": 60,
      "hidden_2d_channels": 32
    }
  },
  "optimizer": {
    "name": "adamw",
    "learning_rate": 0.0001,
    "weight_decay": 0.0001
  },
  "scheduler": {
    "name": "cosine",
    "eta_min": 0.000001
  },
  "training": {
    "epochs": 60,
    "accumulation_steps": 1,
    "grad_clip_norm": 1.0,
    "amp": true,
    "amp_initial_scale": 1024.0,
    "checkpoint_every": 10,
    "early_stopping": {
      "enabled": false,
      "patience": 12,
      "min_delta": 0.0,
      "monitor": "val_rain_rmse"
    }
  },
  "evaluation": {
    "max_batches": null,
    "save_orbits": 0,
    "stratified": {
      "enabled": true,
      "cfb_distance_edges_km": [-1.0, 0.0, 0.5, 2.0]
    },
    "physical_drdz": {
      "enabled": true,
      "sign_epsilon_mm_h_km": 0.1
    }
  },
  "postprocessing": {
    "enabled": true,
    "fail_on_error": false,
    "test_sample_count": 6,
    "selection_seed": 2026,
    "height_km": 2.0,
    "max_scatter_points": 200000,
    "device": "auto",
    "dpi": 150
  },
  "runtime": {
    "deterministic": false,
    "distributed": {
      "backend": "auto",
      "timeout_seconds": 600,
      "broadcast_buffers": false,
      "find_unused_parameters": false,
      "gradient_as_bucket_view": true,
      "static_graph": true,
      "bucket_cap_mb": 25.0
    }
  }
}
