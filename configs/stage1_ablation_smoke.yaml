{
  "experiment": {
    "name": "stage1_e0n_iw_pipeline_smoke",
    "seed": 2026,
    "output_dir": "outputs/smoke/stage1_e0n_iw_pipeline"
  },
  "data": {
    "train_index": "metadata/stage1_patch_indices/train.json",
    "val_index": "metadata/stage1_patch_indices/val.json",
    "test_index": "metadata/stage1_patch_indices/test.json",
    "normalization": "metadata/normalization/stage1_dbz_valid.json",
    "cfb_input_mode": "baseline",
    "cfb_distance_scale_km": 2.0,
    "weak_cfb_layer_weights": [0.1, 0.05],
    "train_positive_only": true,
    "val_positive_only": true,
    "batch_size": 1,
    "block_size": 4,
    "num_workers": 0,
    "cache_size": 1,
    "pin_memory": false,
    "persistent_workers": false
  },
  "model": {
    "in_channels": 3,
    "out_channels": 1,
    "base_channels": 4,
    "channel_multipliers": [1, 2, 4],
    "max_groups": 4,
    "bottleneck_dropout": 0.0
  },
  "loss": {
    "name": "masked_smooth_l1",
    "beta": 0.2,
    "height_loss_weighting": "none",
    "height_loss_weight_min": 0.5,
    "height_loss_weight_max": 3.0,
    "intensity_loss_bin_edges": [1.0, 5.0, 10.0, 30.0],
    "intensity_loss_bin_weights": [1.0, 1.0, 1.5, 2.0, 3.0],
    "thresholds_mm_h": [1.0, 5.0, 10.0, 30.0]
  },
  "optimizer": {
    "name": "adamw",
    "learning_rate": 0.0001,
    "weight_decay": 0.0001
  },
  "scheduler": {"name": "none", "eta_min": 0.000001},
  "training": {
    "epochs": 1,
    "accumulation_steps": 1,
    "grad_clip_norm": 1.0,
    "amp": false,
    "amp_initial_scale": 1024.0,
    "checkpoint_every": 0,
    "early_stopping": {
      "enabled": false,
      "patience": 1,
      "min_delta": 0.0,
      "monitor": "val_rain_rmse"
    }
  },
  "evaluation": {
    "max_batches": 2,
    "save_orbits": 0,
    "stratified": {
      "enabled": true,
      "cfb_distance_edges_km": [-1.0, 0.0, 0.5, 2.0]
    }
  },
  "postprocessing": {"enabled": false},
  "runtime": {
    "deterministic": false,
    "distributed": {
      "backend": "auto",
      "timeout_seconds": 60,
      "broadcast_buffers": false,
      "find_unused_parameters": false,
      "gradient_as_bucket_view": true,
      "static_graph": true,
      "bucket_cap_mb": 25.0
    }
  }
}
