{
  "experiment": {
    "name": "stage3_c1_o_freeze_s2_train_s1",
    "method": "S3-C1-O-S1Adapt",
    "seed": 2026,
    "output_dir": "outputs/stage3/c1_o_s1_adapt"
  },
  "sources": {
    "stage1_checkpoint": "outputs/ablations/stage1_i_g002_t3d/best.pt",
    "stage2_checkpoint": "outputs/stage2_ablations/four_channel_distance_intensity_w1p25/best_dbz.pt",
    "stage2_threshold_file": "outputs/stage2_ablations/four_channel_distance_intensity_w1p25/analysis/validation_candidates/reflectivity/support_threshold.json"
  },
  "data": {
    "batch_size": 1,
    "block_size": 16,
    "num_workers": 2,
    "cache_size": 1,
    "pin_memory": true,
    "persistent_workers": true
  },
  "optimizer": {
    "name": "adamw",
    "learning_rate": 0.00001,
    "weight_decay": 0.0001
  },
  "scheduler": {
    "name": "cosine",
    "eta_min": 0.000001
  },
  "training": {
    "epochs": 20,
    "accumulation_steps": 1,
    "grad_clip_norm": 1.0,
    "amp": true,
    "amp_initial_scale": 1024.0,
    "checkpoint_every": 10,
    "early_stopping": {
      "enabled": true,
      "patience": 8,
      "min_delta": 0.0,
      "monitor": "val_rain_rmse"
    }
  },
  "evaluation": {
    "max_batches": null,
    "cfb_distance_edges_km": [-1.0, 0.0, 0.5, 2.0]
  },
  "postprocessing": {
    "enabled": true,
    "fail_on_error": false,
    "device": "auto",
    "save_orbits": 6,
    "dpi": 150
  },
  "runtime": {
    "deterministic": false,
    "distributed": {
      "backend": "auto",
      "timeout_seconds": 600,
      "broadcast_buffers": false,
      "find_unused_parameters": false,
      "gradient_as_bucket_view": true,
      "static_graph": true,
      "bucket_cap_mb": 25.0
    }
  }
}
